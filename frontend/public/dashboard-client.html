<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Dashboard | Vakeel Sahab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dashboard.css">
<style>
  header.topbar{
    background:var(--navy); color:var(--paper); padding:18px 28px;
    display:flex; align-items:center; justify-content:space-between;
  }
  main{max-width:960px; margin:0 auto; padding:36px 20px 80px;}
  .section-title{font-size:13px; text-transform:uppercase; letter-spacing:.1em; color:var(--gold); margin-bottom:6px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media(max-width:720px){.grid-2{grid-template-columns:1fr;}}
  .consult-card{padding:18px; margin-bottom:14px;}
  .consult-meta{font-size:12px; color:rgba(42,40,35,0.5); margin-top:6px;}
  textarea{width:100%; padding:10px; font-size:14px; resize:vertical;}
  select, input[type=text]{width:100%; padding:10px; font-size:14px; margin-top:4px;}
  .field{margin-bottom:14px;}
  label{font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:rgba(42,40,35,0.55);}

  /* Chatbot widget */
  #chat-toggle{
    position:fixed; bottom:24px; right:24px; width:56px; height:56px; border-radius:50%;
    background:var(--gold); border:none; cursor:pointer; box-shadow:0 10px 24px rgba(0,0,0,0.25);
    font-size:22px; z-index:60;
  }
  #chat-panel{
    position:fixed; bottom:92px; right:24px; width:320px; max-width:90vw; height:420px;
    background:#fff; border:1px solid var(--hairline); border-radius:4px; display:none;
    flex-direction:column; z-index:60; box-shadow:0 20px 50px rgba(0,0,0,0.3);
  }
  #chat-panel.open{display:flex;}
  #chat-header{background:var(--navy); color:var(--paper); padding:12px 16px; font-size:14px; font-weight:600;}
  #chat-messages{flex:1; overflow-y:auto; padding:12px; font-size:13px;}
  .msg{margin-bottom:10px; line-height:1.5;}
  .msg.user{text-align:right;}
  .msg.user span{background:var(--navy); color:#fff; padding:6px 10px; border-radius:10px 10px 0 10px; display:inline-block;}
  .msg.assistant span{background:var(--paper-2); padding:6px 10px; border-radius:10px 10px 10px 0; display:inline-block;}
  #chat-input-row{display:flex; border-top:1px solid var(--hairline);}
  #chat-input{flex:1; border:none; padding:10px; font-size:13px;}
  #chat-send{border:none; background:var(--gold); padding:0 16px; cursor:pointer; font-weight:600;}
</style>
</head>
<body>

<header class="topbar">
  <span class="font-display" style="font-size:20px;">Vakeel <span class="text-gold" style="font-style:italic;">Sahab</span> — Client</span>
  <div style="display:flex; align-items:center; gap:16px; font-size:13px;">
    <span id="welcome-name"></span>
    <button id="logout-btn" class="btn-outline" style="padding:6px 14px; color:var(--paper); border-color:rgba(247,244,238,0.3);">Log Out</button>
  </div>
</header>

<main>
  <section>
    <p class="section-title">New Request</p>
    <h2 class="font-display" style="font-size:26px; margin:0 0 16px;">Book a Consultation</h2>
    <form id="new-request-form" class="card" style="padding:22px;">
      <div class="field">
        <label>What do you need help with?</label>
        <select id="req-type">
          <option value="legal">Legal Consultation</option>
          <option value="website">Website Development Request</option>
        </select>
      </div>
      <div class="field">
        <label>Service</label>
        <input type="text" id="req-service" placeholder="e.g. Challan-related assistance / New business website" />
      </div>
      <div class="field">
        <label>Message</label>
        <textarea id="req-message" rows="4" required placeholder="Describe your requirement..."></textarea>
      </div>
      <button type="submit" class="btn-primary" style="padding:10px 22px;">Submit Request</button>
      <span id="req-success" style="display:none; color:#1E6B36; margin-left:12px; font-size:13px;">Submitted — our team will review it shortly.</span>
    </form>
  </section>

  <section style="margin-top:44px;">
    <p class="section-title">History</p>
    <h2 class="font-display" style="font-size:26px; margin:0 0 16px;">My Consultations</h2>
    <div id="consultations-list"><p style="color:rgba(42,40,35,0.5); font-size:14px;">Loading...</p></div>
  </section>
</main>

<!-- Chatbot widget -->
<button id="chat-toggle" aria-label="Open chat">💬</button>
<div id="chat-panel">
  <div id="chat-header">Ask Vakeel Sahab</div>
  <div id="chat-messages"></div>
  <div id="chat-input-row">
    <input id="chat-input" type="text" placeholder="Type your question..." />
    <button id="chat-send">Send</button>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/chatbot-widget.js"></script>
<script>
  const user = guardPage('client');
  if (user) document.getElementById('welcome-name').textContent = `Welcome, ${user.name}`;

  document.getElementById('logout-btn').addEventListener('click', () => {
    clearSession();
    window.location.href = 'login.html';
  });

  function statusBadge(status) {
    const label = status.replace('_', ' ');
    return `<span class="badge badge-${status}">${label}</span>`;
  }

  async function loadConsultations() {
    const listEl = document.getElementById('consultations-list');
    try {
      const items = await apiRequest('/client/consultations');
      if (items.length === 0) {
        listEl.innerHTML = `<p style="color:rgba(42,40,35,0.5); font-size:14px;">You haven't submitted any requests yet.</p>`;
        return;
      }
      listEl.innerHTML = items.map(c => `
        <div class="card consult-card">
          <div style="display:flex; justify-content:space-between; align-items:start; gap:12px;">
            <div>
              <strong>${c.service || (c.is_website_request ? 'Website Development' : 'Legal Consultation')}</strong>
              <p style="margin:6px 0 0; font-size:14px;">${c.message}</p>
            </div>
            ${statusBadge(c.status)}
          </div>
          <p class="consult-meta">
            ${c.lawyer_name ? `Assigned to: ${c.lawyer_name} · ` : ''}
            Submitted ${new Date(c.created_at).toLocaleDateString()}
          </p>
        </div>
      `).join('');
    } catch (err) {
      listEl.innerHTML = `<p style="color:#8A1D1D; font-size:14px;">${err.message}</p>`;
    }
  }

  document.getElementById('new-request-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const type = document.getElementById('req-type').value;
    try {
      await apiRequest('/client/consultations', {
        method: 'POST',
        body: {
          service: document.getElementById('req-service').value,
          message: document.getElementById('req-message').value,
          isWebsiteRequest: type === 'website',
        },
      });
      document.getElementById('req-success').style.display = 'inline';
      e.target.reset();
      loadConsultations();
      setTimeout(() => { document.getElementById('req-success').style.display = 'none'; }, 4000);
    } catch (err) {
      alert(err.message);
    }
  });

  loadConsultations();
</script>
</body>
</html>
